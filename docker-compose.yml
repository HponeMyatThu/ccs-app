version: '3.8'

services:
  backend:
    image: hmthu30/rust-backend:latest
    container_name: rust-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./data/db:/app/data/db
      - ./data/images:/app/data/images
    environment:
      - DATABASE_URL=sqlite:/app/data/db/database.db
      - SERVER_HOST=0.0.0.0
      - SERVER_PORT=8080
      - RUST_LOG=info
    networks:
      - ccs-network

  frontend:
    # Changed from ccs-frontend to frontend to match your push command
    image: hmthu30/frontend:latest 
    container_name: frontend
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    networks:
      - ccs-network

networks:
  ccs-network:
    driver: bridge